[project]
name = "narlun-server"
version = "0.1.0"
description = "Redis-only backend for Narlun."
readme = "README.md"
requires-python = ">=3.10,<4"
authors = [
    { name = "Kris Fris", email = "31852063+krisfris@users.noreply.github.com" },
]
dependencies = [
    "aiohttp[speedups]>=3.10,<4",
    "aiohttp-cors>=0.7.0,<0.8",
    "async-timeout>=4.0.3,<6",
    "fabric>=3.2,<4",
    "pillow>=10,<12",
    "py-avataaars>=1.1.2,<2",
    "pyjwt>=2.9,<3",
    "pywebpush>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "redis[hiredis]>=5.0,<6",
    "structlog>=24,<26",
    "uvloop>=0.21,<0.22; sys_platform != 'win32'",
    "werkzeug>=3,<4",
]

[dependency-groups]
dev = [
    "aiohttp-devtools>=1.1,<2",
    "autopep8>=2.3,<3",
    "coverage>=7.6,<8",
    "flake8>=7,<8",
    "pytest>=8.3,<9",
    "pytest-aiohttp>=1.1,<2",
    "pytest-cov>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::RuntimeWarning:aiohttp",
]

[tool.uv]
package = false
