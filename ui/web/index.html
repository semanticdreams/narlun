<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Live nearby chat for spontaneous one-to-one and group conversations."
  >
  <meta name="theme-color" content="#5F4484">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="narlun">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">

  <title>narlun | opening</title>

  <style>
    :root {
      color-scheme: light;
      --shell-bg: #1b1328;
      --shell-bg-accent: #5f4484;
      --shell-text: #f7efff;
      --shell-muted: #d6c6eb;
      --shell-card: rgba(255, 255, 255, 0.08);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(152, 112, 201, 0.38), transparent 45%),
        linear-gradient(180deg, #291b3d 0%, var(--shell-bg) 62%);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    #app-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 9999;
      transition: opacity 180ms ease;
    }

    body.app-ready #app-shell {
      opacity: 0;
      pointer-events: none;
    }

    .shell-card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 24px;
      background: var(--shell-card);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      color: var(--shell-text);
    }

    .shell-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: block;
      object-fit: contain;
    }

    .shell-title {
      margin: 0 0 8px;
      font-size: 2rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.06em;
      line-height: 0.96;
      text-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
      font-family:
        "Trebuchet MS", "Arial Rounded MT Bold", "Avenir Next",
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .shell-copy {
      margin: 0;
      color: var(--shell-muted);
      line-height: 1.5;
    }

    .shell-loader {
      width: 56px;
      height: 56px;
      margin: 24px auto 0;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.16);
      border-top-color: #ffffff;
      animation: shell-spin 1s linear infinite;
    }

    @keyframes shell-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="app-shell" role="status" aria-live="polite" aria-label="narlun is opening">
    <div class="shell-card">
      <img class="shell-mark" src="icons/Icon-192.png" alt="">
      <h1 class="shell-title">narlun</h1>
      <p class="shell-copy">
        Nearby chat is opening. This should only take a moment.
      </p>
      <div class="shell-loader"></div>
    </div>
  </div>

  <script>
    (function () {
      var deferredInstallPrompt = null;
      var installDetected = false;
      var bootstrapDiagnostics = [];

      function pushBootstrapDiagnostic(kind, message, details) {
        bootstrapDiagnostics.push({
          kind: kind,
          message: message,
          details: details || {},
          ts: new Date().toISOString(),
        });
      }

      window.__narlunPushBootstrapDiagnostic = pushBootstrapDiagnostic;

      window.__narlunConsumeDeferredInstallPrompt = function () {
        var prompt = deferredInstallPrompt;
        deferredInstallPrompt = null;
        return prompt;
      };

      window.__narlunConsumeBootstrapDiagnostics = function () {
        var events = bootstrapDiagnostics.slice();
        bootstrapDiagnostics = [];
        return events;
      };

      window.__narlunInstalledFromBootstrap = function () {
        return installDetected;
      };

      pushBootstrapDiagnostic(
        'bootstrap_shell_initialized',
        'Initialized the web startup shell.',
        {
          is_secure_context: window.isSecureContext === true,
          service_worker_supported: 'serviceWorker' in navigator,
        },
      );

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredInstallPrompt = event;
        pushBootstrapDiagnostic(
          'install_beforeinstallprompt_captured',
          'Captured beforeinstallprompt during HTML bootstrap.',
          {
            platform_count: Array.isArray(event.platforms) ? event.platforms.length : null,
          },
        );
      });

      window.addEventListener('appinstalled', function () {
        installDetected = true;
        deferredInstallPrompt = null;
        pushBootstrapDiagnostic(
          'install_appinstalled_bootstrap',
          'Browser reported installation during HTML bootstrap.',
        );
      });
    }());

    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('app-ready');
    });

    var serviceWorkerVersion = '{{flutter_service_worker_version}}';
    var scriptLoaded = false;

    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        loadMainDartJs();
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        window.__narlunPushBootstrapDiagnostic(
          'push_service_worker_register_started',
          'Started browser service worker registration.',
          {
            service_worker_url: serviceWorkerUrl,
          },
        );
        navigator.serviceWorker.register(serviceWorkerUrl).then(function (registration) {
          window.__narlunPushBootstrapDiagnostic(
            'push_service_worker_registered',
            'Registered the browser service worker.',
            {
              scope: registration && registration.scope ? registration.scope : null,
              has_active_worker: !!(registration && registration.active),
              has_waiting_worker: !!(registration && registration.waiting),
              has_installing_worker: !!(registration && registration.installing),
            },
          );
        }).catch(function (error) {
          window.__narlunPushBootstrapDiagnostic(
            'push_service_worker_register_failed',
            'Browser service worker registration failed.',
            {
              error: error ? String(error) : null,
              service_worker_url: serviceWorkerUrl,
            },
          );
        });
      });
    } else {
      loadMainDartJs();
    }
  </script>
</body>
</html>
