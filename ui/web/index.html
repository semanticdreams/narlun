<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Live nearby chat for spontaneous one-to-one and group conversations."
  >
  <meta name="theme-color" content="#5F4484">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Narlun">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">

  <title>Narlun</title>

  <style>
    :root {
      color-scheme: light;
      --shell-bg: #1b1328;
      --shell-bg-accent: #5f4484;
      --shell-text: #f7efff;
      --shell-muted: #d6c6eb;
      --shell-card: rgba(255, 255, 255, 0.08);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(152, 112, 201, 0.38), transparent 45%),
        linear-gradient(180deg, #291b3d 0%, var(--shell-bg) 62%);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    #app-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 9999;
      transition: opacity 180ms ease;
    }

    body.app-ready #app-shell {
      opacity: 0;
      pointer-events: none;
    }

    .shell-card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 24px;
      background: var(--shell-card);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      color: var(--shell-text);
    }

    .shell-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06)),
        linear-gradient(145deg, #7c5ab2, #4b3569);
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .shell-title {
      margin: 0 0 8px;
      font-size: 2rem;
      font-weight: 700;
    }

    .shell-copy {
      margin: 0;
      color: var(--shell-muted);
      line-height: 1.5;
    }

    .shell-loader {
      width: 56px;
      height: 56px;
      margin: 24px auto 0;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.16);
      border-top-color: #ffffff;
      animation: shell-spin 1s linear infinite;
    }

    @keyframes shell-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="app-shell" aria-hidden="true">
    <div class="shell-card">
      <div class="shell-mark">N</div>
      <h1 class="shell-title">Narlun</h1>
      <p class="shell-copy">
        Live nearby chat with installable app behavior, instant room updates,
        and a web-first experience.
      </p>
      <div class="shell-loader"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('app-ready');
    });

    var serviceWorkerVersion = '{{flutter_service_worker_version}}';
    var scriptLoaded = false;

    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl).then((reg) => {
          function waitForActivation(serviceWorker) {
            serviceWorker.addEventListener('statechange', () => {
              if (serviceWorker.state === 'activated') {
                loadMainDartJs();
              }
            });
          }

          if (!reg.active && (reg.installing || reg.waiting)) {
            waitForActivation(reg.installing || reg.waiting);
          } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
            reg.update();
            waitForActivation(reg.installing);
          } else {
            loadMainDartJs();
          }
        });

        setTimeout(() => {
          if (!scriptLoaded) {
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      loadMainDartJs();
    }
  </script>
</body>
</html>
